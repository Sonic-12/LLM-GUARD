version: '3.8'

services:
  firewall-ml:
    build:
      context: .
      dockerfile: services/firewall/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FIREWALL_SERVICE_URL=http://firewall-ml:5001
      - UPSTREAM_LLM_URL=http://127.0.0.1:11434
    depends_on:
      - firewall-ml
